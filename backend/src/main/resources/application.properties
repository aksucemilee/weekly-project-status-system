spring.application.name=weekly-project-status

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/weekly_project_status}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Oturum cerezi ---
# HttpOnly: JavaScript cerezi okuyamaz (XSS ile oturum calinmasini engeller).
# Secure: yalnizca HTTPS uzerinden gonderilir. Lokal demo HTTP uzerinden
# calistigi icin varsayilani false'tur; uretimde COOKIE_SECURE=true
# verilmelidir, aksi halde tarayici cerezi hic gondermez ve giris yapilamaz.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# --- Giris denemesi siniri (brute-force korumasi) ---
security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}

# --- Uretim sertlestirmesi ---
# true yapildiginda HSTS baslugi gonderilir. Lokal demoda kapali olmalidir:
# HSTS tarayiciyi bu host adina HTTPS'e kilitler ve HTTP gelistirmeyi bozar.
security.production-hardening=${PRODUCTION_HARDENING:false}

# Reverse proxy arkasinda TLS sonlandiriliyorsa, uygulamanin istegin
# aslinda HTTPS oldugunu anlamasi icin gereklidir.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
