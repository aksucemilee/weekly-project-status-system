# Testler in-memory H2 uzerinde calisir: mvnw test calisan bir PostgreSQL
# kurulumu gerektirmez. Sema her test calismasinda sifirdan olusturulur.
spring.datasource.url=jdbc:h2:mem:weekly_project_status_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Seeder'lar testte calismaz: test verisini her test kendisi kurar.
SEED_DEMO_DATA=false
